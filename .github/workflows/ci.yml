name: CI

on:
  push:
    branches: [main, preview, 'codex/test-sqlite-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run browser regression tests
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          export CHROME_BIN
          "$CHROME_BIN" --version
          npm run test:browser
  clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run clipboard regression in a real VS Code webview
        run: xvfb-run -a npm run test:clipboard-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-host-results
          path: test-results/clipboard-host/
          if-no-files-found: ignore
          retention-days: 7
