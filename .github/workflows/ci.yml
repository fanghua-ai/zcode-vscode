name: CI

on:
  push:
    branches: [main, preview, 'codex/test-sqlite-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify ZCode 3.18.2 system credentials
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          platform="$(node -p 'process.platform')"
          arch="$(node -p 'process.arch')"
          package="keyring-${platform}-${arch}"
          if [[ "$platform" == win32 ]]; then
            package="$package-msvc"
          else
            keychain="$RUNNER_TEMP/zcode-test.keychain-db"
            password="$(openssl rand -hex 24)"
            original="$(security default-keychain -d user | xargs)"
            security create-keychain -p "$password" "$keychain"
            trap 'security list-keychains -d user -s "$original"; security default-keychain -d user -s "$original"; security delete-keychain "$keychain"' EXIT
            security unlock-keychain -p "$password" "$keychain"
            security list-keychains -d user -s "$keychain"
            security default-keychain -d user -s "$keychain"
          fi
          prefix="$RUNNER_TEMP/zcode-keyring"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "@napi-rs/$package@2.1.2"
          node scripts/credential-keyring-smoke.mjs "$prefix/node_modules/@napi-rs/$package"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run browser regression tests
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          export CHROME_BIN
          "$CHROME_BIN" --version
          npm run test:browser
  clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run clipboard regression in a real VS Code webview
        run: xvfb-run -a npm run test:clipboard-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-host-results
          path: test-results/clipboard-host/
          if-no-files-found: ignore
          retention-days: 7
